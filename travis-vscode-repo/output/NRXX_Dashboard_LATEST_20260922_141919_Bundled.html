document.addEventListener("DOMContentLoaded", function() {

        function parseCSV(text) {
            if (!text || text.trim() === '') return [];
            return text.trim().split(/\r?\n/).map(line => line.split(',').map(s => s.trim()));
        }

        const matrixHires = parseCSV(rawHiresTermsCSV);
        const matrixActuals = parseCSV(rawRosterNeedActualCSV);

        if (matrixActuals.length < 3) throw new Error("Dashboard Error: Not enough data provided to build the dashboard.");

        const headerNodes = matrixActuals[0];
        const rawNodes = [];
        const colIndices = [];
        for (let c = 0; c < headerNodes.length; c++) {
            if (headerNodes[c]) { rawNodes.push(headerNodes[c]); colIndices.push(c); }
        }
        
        const phtCounts = [];
        const phtRow = matrixActuals[1];
        colIndices.forEach(col => {
            let phtVal = 0;
            for (let offset = 0; offset < 4; offset++) {
                let candidate = parseInt(phtRow[col + offset], 10);
                if (!isNaN(candidate)) { phtVal = candidate; break; }
            }
            phtCounts.push(phtVal);
        });

        function getThanksgivingDate(year) {
            const novFirst = new Date(year, 10, 1);
            const dayOfWeek = novFirst.getDay();
            return new Date(year, 10, 1 + (4 - dayOfWeek + 7) % 7 + 21);
        }
        const peakTargetDate = getThanksgivingDate(new Date().getFullYear());
        let nodeData = {};

        rawNodes.forEach((node, index) => {
            const colStart = colIndices[index];
            let hires = [], terms = [], histDates = [], totalHires = 0, totalTerms = 0;
            for (let r = 2; r < matrixHires.length; r++) {
                const row = matrixHires[r];
                if (row && row.length > colStart && row[colStart]) {
                    const h = parseInt(row[colStart + 1], 10) || 0;
                    const t = parseInt(row[colStart + 2], 10) || 0;
                    hires.push(h); terms.push(t); histDates.push(row[colStart]); totalHires += h; totalTerms += t;
                }
            }
            
            let currentActual = 0, peakNeed = 0, needTrend = [], actualTrend = [], actualDates = [], stationBaselineDate = null;
            
            // ** THE DEFINITIVE FIX: UNIVERSAL BASELINE LOGIC **
            // This loop now correctly finds the most recent, non-zero actual headcount date for EACH node, including "NRXX Overall".
            for (let r = matrixActuals.length - 1; r >= 3; r--) {
                const row = matrixActuals[r];
                if (row && row.length > colStart && row[colStart] && (parseInt(row[colStart + 2], 10) > 0)) {
                    stationBaselineDate = row[colStart];
                    break;
                }
            }
            
            for (let r = 3; r < matrixActuals.length; r++) {
                const row = matrixActuals[r];
                if (row && row.length > colStart && row[colStart]) {

                    const need = parseInt(row[colStart + 1], 10) || 0;

                    actualDates.push(date); needTrend.push(need); actualTrend.push(actual > 0 ? actual : null);

                    if (date.includes('-11-') || date.includes('-12-')) { if (need > peakNeed) peakNeed = need; }
                }
            }
            if (peakNeed === 0 && needTrend.length > 0) peakNeed = Math.max(...needTrend.filter(Boolean));

            const avgTerms = terms.slice(-8).reduce((a, b) => a + b, 0) / (terms.slice(-8).length || 1);
            const netNeeded = Math.max(0, peakNeed - currentActual);
            const weeklyTarget = (netNeeded / weeksToPeak) + avgTerms;

            nodeData[node] = {

cleanId}"></canvas></div></div></div>`;
            nodesContainer.insertAdjacentHTML('beforeend', html);
