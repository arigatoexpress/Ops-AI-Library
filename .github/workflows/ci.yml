name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check docs and prompt index
        run: |
          node scripts/check-docs.mjs
          node scripts/build-prompt-index.mjs
          git diff --exit-code -- prompts/explorer.html prompts/CATALOG.md || {
            echo "Prompt index is stale. Run node scripts/build-prompt-index.mjs"
            exit 1
          }

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zero-Click prototype tests
        run: python3 -m unittest discover -s concepts/zero-click-compliance/prototype/tests -v
